services:
  rc:
    build: .
    restart: unless-stopped
    # Bound to localhost for safe local testing. Coolify should route to
    # container port 8787 through its proxy instead of publishing this port.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      DATA_DIR: /data
      RC_SECRET_KEY: ${RC_SECRET_KEY:?Set RC_SECRET_KEY to a 32+ character random value}
      RC_ADMIN_PASSWORD: ${RC_ADMIN_PASSWORD:?Set a shared admin password}
      RC_DEVICE_TOKEN: ${RC_DEVICE_TOKEN:?Set a shared device token}
      RC_PUBLIC_ORIGIN: ${RC_PUBLIC_ORIGIN:-http://localhost:8787}
    volumes:
      - rc-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:8787/api/health'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rc-data:
